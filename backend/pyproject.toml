[project]
name = "homedash-backend"
version = "0.1.0"
description = "Self-hosted wall-mounted family calendar: backend and API"
authors = [
    { name = "Nicholas Marrone", email = "nickmarrone@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "caldav>=3.2.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "icalendar>=7.2.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyheos>=1.0.6",
    "python-dateutil>=2.9.0.post0",
    "recurring-ical-events>=3.8.2",
    "sqlmodel>=0.0.39",
    "sse-starlette>=3.4.8",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.3",
    "watchdog>=6.0.0",
]

[project.scripts]
homedash-backend = "app:main"
homedash-inspect-calendars = "app.cli.inspect_calendars:main"
homedash-google-auth = "app.cli.google_auth:main"
homedash-heos-probe = "app.cli.heos_probe:main"

[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint and format. `.gitignore` has listed `.ruff_cache/` since the first
# commit and the source carries `# noqa` markers, so ruff was always the
# intention - it just never had a config, which meant nothing ran it and the
# markers were decorative.
#
# 100 rather than the 95 the code was held to by hand: the hand-held limit was
# approximate, and picking the exact number would have meant reflowing seventy
# lines that are already perfectly readable. Every real change in this
# repository's history is worth more than that diff.
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F are pycodestyle and pyflakes - unused imports and locals, undefined
# names, the things a reader cannot see and a test will not catch. I is import
# ordering. B is bugbear, which is where the genuinely useful checks live
# (mutable default arguments, loop-variable capture in closures).
#
# Deliberately not the whole catalogue, and pyupgrade (UP) in particular is
# left out. It wanted eighty-nine changes, all of them rewrites of correct code
# into differently-spelled correct code - `timezone.utc` to `UTC`, `X | None`
# for `Optional[X]`. A linter that opens with two hundred stylistic opinions on
# an existing codebase gets switched off within the week, and the rules that
# find real defects go with it.
select = ["E", "F", "I", "B"]
ignore = [
    # SQLAlchemy filters are expressions, not conditions: `Model.flag == False`
    # builds SQL, while `not Model.flag` evaluates in Python and silently
    # matches everything. Every occurrence in this repo is deliberate and each
    # one already carries a `# noqa` explaining itself.
    "E712",
    "E711",
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures for their side effects and shadow names freely.
"tests/*" = ["F811"]
# Alembic writes these files, and it writes them in its own import order.
# Sorting them means every `revision --autogenerate` produces a file the linter
# rejects, which trains people to ignore the linter.
"migrations/*" = ["I001"]
