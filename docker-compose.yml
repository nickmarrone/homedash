services:
  homedash:
    build: .
    container_name: homedash
    ports:
      - "8000:8000"
    volumes:
      - homedash-data:/app/backend/data
    environment:
      HOMEDASH_HOME_TIMEZONE: ${HOMEDASH_HOME_TIMEZONE:-UTC}
      # Quoted: the value is JSON, whose braces and quotes would otherwise be
      # read as YAML flow syntax.
      HOMEDASH_ICS_CALENDARS: "${HOMEDASH_ICS_CALENDARS:-[]}"
      HOMEDASH_WEATHER_LATITUDE: ${HOMEDASH_WEATHER_LATITUDE:-0}
      HOMEDASH_WEATHER_LONGITUDE: ${HOMEDASH_WEATHER_LONGITUDE:-0}
      HOMEDASH_WEATHER_TEMPERATURE_UNIT: ${HOMEDASH_WEATHER_TEMPERATURE_UNIT:-fahrenheit}
    restart: unless-stopped

volumes:
  homedash-data:
