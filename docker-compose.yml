services:
  homedash:
    build: .
    container_name: homedash
    ports:
      - "8000:8000"
    volumes:
      - homedash-data:/app/backend/data
      # Read-only on purpose: a bug in HomeDash must never be able to delete a
      # family photo. Point HOMEDASH_PHOTOS_SOURCE at wherever yours live.
      - ${HOMEDASH_PHOTOS_SOURCE:-./photos}:/photos:ro
      # Its own volume rather than a directory under the data one: these are
      # regenerable from the originals, so a backup of the database should not
      # have to carry them, and this can be deleted to force a clean re-render.
      - homedash-photos:/app/backend/photo-cache
    environment:
      HOMEDASH_HOME_TIMEZONE: ${HOMEDASH_HOME_TIMEZONE:-UTC}
      # Quoted: the values are JSON, whose braces and quotes would otherwise
      # be read as YAML flow syntax.
      HOMEDASH_CALENDARS: "${HOMEDASH_CALENDARS:-[]}"
      HOMEDASH_CALENDAR_CREDENTIALS: "${HOMEDASH_CALENDAR_CREDENTIALS:-}"
      # Deprecated alias, passed through so an existing .env keeps working.
      HOMEDASH_ICS_CALENDARS: "${HOMEDASH_ICS_CALENDARS:-[]}"
      HOMEDASH_ICS_POLL_INTERVAL_MINUTES: ${HOMEDASH_ICS_POLL_INTERVAL_MINUTES:-15}
      HOMEDASH_FAST_POLL_INTERVAL_MINUTES: ${HOMEDASH_FAST_POLL_INTERVAL_MINUTES:-1}
      HOMEDASH_FULL_RESYNC_INTERVAL_MINUTES: ${HOMEDASH_FULL_RESYNC_INTERVAL_MINUTES:-60}
      HOMEDASH_SYNC_WINDOW_PAST_DAYS: ${HOMEDASH_SYNC_WINDOW_PAST_DAYS:-30}
      HOMEDASH_SYNC_WINDOW_FUTURE_DAYS: ${HOMEDASH_SYNC_WINDOW_FUTURE_DAYS:-365}
      HOMEDASH_WEEK_STARTS_ON: ${HOMEDASH_WEEK_STARTS_ON:-sunday}
      HOMEDASH_WEATHER_LATITUDE: ${HOMEDASH_WEATHER_LATITUDE:-0}
      HOMEDASH_WEATHER_LONGITUDE: ${HOMEDASH_WEATHER_LONGITUDE:-0}
      HOMEDASH_COMETS_ENABLED: ${HOMEDASH_COMETS_ENABLED:-true}
      HOMEDASH_COMET_REFRESH_HOURS: ${HOMEDASH_COMET_REFRESH_HOURS:-24}
      HOMEDASH_COMET_MAGNITUDE_LIMIT: ${HOMEDASH_COMET_MAGNITUDE_LIMIT:-6.0}
      HOMEDASH_WEATHER_TEMPERATURE_UNIT: ${HOMEDASH_WEATHER_TEMPERATURE_UNIT:-fahrenheit}
      HOMEDASH_WEATHER_CACHE_MINUTES: ${HOMEDASH_WEATHER_CACHE_MINUTES:-20}
      # Quoted for the same reason as the calendar values above.
      HOMEDASH_SCREEN_SCHEDULE: "${HOMEDASH_SCREEN_SCHEDULE:-}"
      HOMEDASH_DEVICE_NAME: ${HOMEDASH_DEVICE_NAME:-panel}
      HOMEDASH_PHOTOS_DIR: /photos
      HOMEDASH_PHOTO_CACHE_DIR: /app/backend/photo-cache
      HOMEDASH_PHOTO_INDEX_INTERVAL_MINUTES: ${HOMEDASH_PHOTO_INDEX_INTERVAL_MINUTES:-15}
      HOMEDASH_PHOTO_MAX_COUNT: ${HOMEDASH_PHOTO_MAX_COUNT:-2000}
      HOMEDASH_SCREENSAVER_IDLE_MINUTES: ${HOMEDASH_SCREENSAVER_IDLE_MINUTES:-5}
      HOMEDASH_SCREENSAVER_DWELL_SECONDS: ${HOMEDASH_SCREENSAVER_DWELL_SECONDS:-30}
    restart: unless-stopped

volumes:
  homedash-data:
  homedash-photos:
